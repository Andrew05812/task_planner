name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle.properties carries this developer's absolute Windows paths (org.gradle.java.home,
      # org.gradle.user.home). They are valid only on this machine, so the runner drops them and
      # uses the JDK and Gradle home the runner already provides.
      - name: Remove machine-specific Gradle settings
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          sed -i '/^org\.gradle\.user\.home=/d' gradle.properties
          sed -i '/^org\.gradle\.daemon=/d' gradle.properties

      # The repository was created on Windows, where the wrapper has no executable bit.
      - name: Make the Gradle wrapper runnable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: Unit tests (Room migrations, session, backup, sync)
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --console=plain lintDebug

      # The instrumented tests need a device, which a runner does not provide, so CI only proves
      # that they build; running them stays a manual, on-device step.
      - name: Compile instrumented tests
        run: ./gradlew --no-daemon --console=plain assembleDebugAndroidTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
