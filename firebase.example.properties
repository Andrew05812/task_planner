# Task Planner — cloud configuration template. Copy, fill in, keep private.
#
# What this file is for
# ---------------------
# Google Sign-In and Firestore sync need four values that belong to a Firebase project. The build reads them as
# Gradle properties and bakes them into `BuildConfig` (app/build.gradle.kts:34-41); `CloudConfig.isConfigured`
# (data/auth/CloudConfig.kt:19-21) is false while they are the literal `NOT_CONFIGURED`, and while it is false
# the app is fully local: no Firebase initialisation, no sign-in, no sync work.
#
# How to use it
# -------------
# 1. Copy this file to `local.properties` in the repository root — the file Android Studio already creates for
#    `sdk.dir`, and the one `.gitignore` keeps out of git. Append these four lines to it; do not overwrite the
#    `sdk.dir` line.
# 2. Fill the values from the Firebase console, following docs/FIREBASE_SETUP.md sections 2 and 3.
# 3. Build. A build without these lines succeeds and says so; a build with them enables the cloud path.
#
# Why not `gradle.properties`
# ---------------------------
# `gradle.properties` is committed to this repository. Putting a real API key or client id there publishes it
# to anyone who can read the project, and it stays in git history after the fact. `local.properties`, or `-P`
# flags on a single command, or CI repository secrets are the three places a real value belongs.
#
# These are placeholders. Every one of them is the shape of a real value, not a real value.

firebase.projectId=NOT_CONFIGURED
# Firebase console → Project settings → Your apps → Android app → App ID
# Shape: 1:<project-number>:android:<32-hex-chars>
firebase.appId=NOT_CONFIGURED
# Firebase console → Project settings → Your apps → Android app → API key (an Android key, `AIza…`)
# FirebaseOptions needs it, and `CloudConfig.configuredFor` counts it: three of the four values is a local build,
# not a cloud build with a gap.
firebase.apiKey=NOT_CONFIGURED
# Google Cloud console → Credentials → OAuth 2.0 client IDs → the *Web client* id (not the Android one)
# Shape: <digits>-<32-chars>.apps.googleusercontent.com
# This is the server client id Credential Manager asks Google for an ID token against.
google.webClientId=NOT_CONFIGURED
